# Local stack: Postgres 18 + Go API + Next.js web.  `make up` then open http://localhost:3000
name: stackstep

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: stackstep
      POSTGRES_PASSWORD: stackstep
      POSTGRES_DB: stackstep
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackstep"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://stackstep:stackstep@db:5432/stackstep?sslmode=disable
      WEB_BASE_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      LEAD_REPLY_DELAY: 5s
      # Sign in with GitHub. Callback URL = http://localhost:3000/api/v1/auth/github/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BOOTSTRAP_ADMIN_GITHUB_LOGINS: ${BOOTSTRAP_ADMIN_GITHUB_LOGINS:-}
      # Optional: the student AI helper (see docs/SETUP.md §4). Empty = helper off.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      TRUSTED_PROXIES: 0.0.0.0/0
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8080
      PUBLIC_WS_URL: ws://localhost:8080/v1/ws
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  db:
