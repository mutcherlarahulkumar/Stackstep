# Local stack: Postgres 18 + Go API + Next.js web.  `make up` then open http://localhost:3000
name: stackstep

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: stackstep
      POSTGRES_PASSWORD: stackstep
      POSTGRES_DB: stackstep
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackstep"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    build: ./backend
    entrypoint: ["/usr/local/bin/seed"]
    environment: &api-env
      APP_ENV: development
      DATABASE_URL: postgres://stackstep:stackstep@db:5432/stackstep?sslmode=disable
      WEB_BASE_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      LEAD_REPLY_DELAY: 5s
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    environment:
      <<: *api-env
      # Optional: real GitHub OAuth. Callback URL = http://localhost:3000/api/v1/auth/github/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BOOTSTRAP_ADMIN_GITHUB_LOGINS: ${BOOTSTRAP_ADMIN_GITHUB_LOGINS:-}
      TRUSTED_PROXIES: 0.0.0.0/0
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      seed: { condition: service_completed_successfully }

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8080
      PUBLIC_WS_URL: ws://localhost:8080/v1/ws
      DEV_LOGIN: "true"
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  db:
