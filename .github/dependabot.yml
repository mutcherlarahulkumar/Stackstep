version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly, day: monday }
    groups:
      go-deps: { patterns: ["*"] }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      next-react: { patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next", "babel-plugin-react-compiler"] }
      radix-shadcn: { patterns: ["radix-ui", "lucide-react", "class-variance-authority", "tailwind-merge", "clsx", "sonner", "tw-animate-css"] }
      tooling: { patterns: ["eslint", "typescript*", "vitest", "@vitejs/*", "@testing-library/*", "jsdom", "tailwindcss", "@tailwindcss/*"] }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: pub
    directory: /mobile
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: docker
    directories: [/backend, /web]
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci(deps)" }
