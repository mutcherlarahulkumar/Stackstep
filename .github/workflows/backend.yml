name: Backend

on:
  push:
    branches: [main]
    paths: [backend/**, scripts/check-dsa.mjs, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**, scripts/check-dsa.mjs, .github/workflows/backend.yml]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall # built with this Go, so it understands go 1.27 modules
          working-directory: backend

  test:
    name: Test (Postgres 18)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: stackstep
          POSTGRES_PASSWORD: stackstep
          POSTGRES_DB: stackstep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stackstep" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://stackstep:stackstep@localhost:5432/stackstep_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -func=coverage.out | tail -1
      - name: Every DSA example in the curriculum has the right answer
        run: |
          go run ./cmd/dbadmin curriculum -dump > "$RUNNER_TEMP/curriculum.json"
          node ../scripts/check-dsa.mjs "$RUNNER_TEMP/curriculum.json"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  image:
    name: Docker image
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: stackstep-api:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
