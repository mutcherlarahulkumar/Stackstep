name: API · keep awake

# Free Render instances sleep after 15 idle minutes, and the first request then takes up to a
# minute. This pings the API every 10 minutes so students don't wait. Set the repository
# variable API_URL (for example https://stackstep-api.onrender.com) to turn it on; without it
# the job does nothing. Not needed on a paid instance.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /readyz
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${API_URL%/}/readyz" -o /dev/null -w "readyz %{http_code} in %{time_total}s\n"
