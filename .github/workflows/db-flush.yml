name: Database · flush seeded data

# Removes the demo seed from a deployed database. Run by hand from the Actions tab.
# "demo" deletes only the demo accounts (admin-demo, asha-dev, ...), their internships and the
# demo React flow, templates, personas, cohort and college. "all" empties every table except
# programs and the default team lead; real users and internships go too.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose DATABASE_URL secret to use
        type: environment
        required: true
        default: production
      mode:
        description: What to remove
        type: choice
        options: [demo, all]
        default: demo
      confirm:
        description: Type FLUSH to confirm
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: database-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  flush:
    name: Flush (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'FLUSH'
        run: |
          echo "::error::Type FLUSH in the confirm box to run this."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Flush
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add a DATABASE_URL secret to the '${{ inputs.environment }}' environment."; exit 1; fi
          go run ./cmd/dbadmin flush -mode "$MODE" -confirm FLUSH | tee -a "$GITHUB_STEP_SUMMARY"
