name: Mobile

on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/mobile.yml]
  pull_request:
    paths: [mobile/**, .github/workflows/mobile.yml]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format (advisory; run `dart format lib test` locally)
        continue-on-error: true
        run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          retention-days: 7

  android:
    name: Android build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: stackstep-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios:
    name: iOS build (no codesign)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
