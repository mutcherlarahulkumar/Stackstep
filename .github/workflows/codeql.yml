name: CodeQL

on:
  # Security scan on main and weekly; not on PRs, and never blocks anything.
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    # Code scanning may not be enabled on this repo yet; report, don't fail.
    continue-on-error: true
    permissions:
      actions: read # the CodeQL upload reads the workflow run (required on private repos)
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - if: matrix.language == 'go'
        working-directory: backend
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
